<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квиддич: Поймай Снитча! Пиксельный полёт</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Pixelated MS Sans Serif', monospace;
            padding: 20px;
        }

        .game-wrapper {
            background: #1e2a2a;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 0 4px #8b5a2b, 0 12px 28px black;
            border: 2px solid #d4af37;
        }

        canvas {
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 3px #2c2e1e, 0 8px 20px black;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: pixelated;
            background: #1d3b2a;
            cursor: none;
        }

        .info-panel {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            gap: 12px;
            background: #0d1a1acc;
            backdrop-filter: blur(4px);
            padding: 8px 18px;
            border-radius: 32px;
            border: 1px solid #f3b33d;
        }

        .stats {
            display: flex;
            gap: 18px;
            background: #00000099;
            padding: 4px 16px;
            border-radius: 28px;
        }

        .stat {
            font-weight: bold;
            font-size: 1.2rem;
            color: #ffd966;
            text-shadow: 2px 2px 0 #6a3e00;
            letter-spacing: 1px;
        }

        .shop {
            background: #191e1eaa;
            padding: 5px 15px;
            border-radius: 40px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .shop button {
            background: #3a2a1a;
            border: none;
            font-family: monospace;
            font-weight: bold;
            color: #ffeaac;
            padding: 5px 12px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.1s linear;
            box-shadow: inset 0 -2px 0 #5a3e1a, 0 2px 4px black;
        }
        .shop button:active {
            transform: translateY(2px);
            box-shadow: inset 0 0px 0 #5a3e1a;
        }

        .restart-btn {
            background: #a7521c;
            color: #ffefb0;
            padding: 6px 18px;
            border-radius: 32px;
            font-weight: bold;
            border: none;
            font-family: monospace;
            cursor: pointer;
            box-shadow: inset 0 -2px 0 #4a2a0a;
        }

        select {
            background: #2d2b1c;
            border: 1px solid gold;
            color: #ffeeaa;
            padding: 4px 8px;
            border-radius: 28px;
            font-family: monospace;
            font-weight: bold;
        }
        .controls {
            font-size: 0.7rem;
            color: #cdddb0;
        }
        @media (max-width: 700px) {
            .stat { font-size: 0.9rem; }
            .shop button { font-size: 0.7rem; padding: 3px 8px; }
        }
    </style>
</head>
<body>
<div>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="500" style="width:100%; height:auto; max-width:800px; aspect-ratio:800/500"></canvas>
        <div class="info-panel">
            <div class="stats">
                <div class="stat">🏆 СЧЁТ: <span id="scoreValue">0</span></div>
                <div class="stat">💰 <span id="moneyAmount">0</span> ГАЛЛЕОНОВ</div>
                <div class="stat">⚡ СКОРОСТЬ: <span id="speedLevel">1</span></div>
            </div>
            <div class="shop">
                <span style="color:#eebb55;">🛒 УЛУЧШЕНИЕ</span>
                <button id="buySpeedBtn">📈 +СКОРОСТЬ (50💰)</button>
            </div>
            <select id="characterSelect">
                <option value="harry">⚡ ГАРРИ ПОТТЕР</option>
                <option value="hermione">📖 ГЕРМИОНА</option>
                <option value="draco">🐍 ДРАКО МАЛФОЙ</option>
                <option value="luna">🌙 ПОЛУМНА</option>
            </select>
            <button class="restart-btn" id="restartBtn">🌀 НОВАЯ ИГРА</button>
        </div>
        <div class="controls" style="text-align:center; margin-top:10px;">🖱️ МЫШЬ/ПАЛЕЦ → двигай метлу | 🟤 уворачивайся от коричневых шаров | ✨ ПОЙМАЙ ЗОЛОТОЙ СНИТЧ = ПОБЕДА!</div>
    </div>
</div>

<script>
    (function() {
        // ----- ПИКСЕЛЬНЫЙ РЕНДЕР И НАСТРОЙКИ -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // отключаем сглаживание для пиксельного вида
        ctx.imageSmoothingEnabled = false;
        
        let cw = 800, ch = 500;
        canvas.width = cw;
        canvas.height = ch;
        
        // ----- ИГРОВЫЕ ПЕРЕМЕННЫЕ -----
        let gameRunning = true;
        let victory = false;       // true если пойман снитч
        let score = 0;
        let money = 80;            // стартовые 80 галлеонов
        let speedLevel = 1;
        let currentSpeed = 3.2;    // базовая скорость препятствий (коричневые шары)
        
        // Игрок
        const PLAYER_W = 38;
        const PLAYER_H = 38;
        let playerX = cw/2 - PLAYER_W/2;
        const playerY = ch - 72;
        let mouseX = playerX + PLAYER_W/2;
        
        // Шары (обычные коричневые)
        let obstacles = [];
        const BROWN_RADIUS = 14;
        let spawnCounter = 0;
        let SPAWN_DELAY_FRAMES = 28;  // уменьшается со скоростью? оставим фиксированную, но можно
        
        // ----- ЗОЛОТОЙ СНИТЧ (единственный) -----
        let snitch = null;   // { x, y, radius, captured }
        let snitchActive = true;
        const SNITCH_RADIUS = 12;
        let snitchSpeedX = 1.6;
        let snitchSpeedY = 1.4;
        
        // фон: лес/замок (пиксельный стиль)
        let bgForest, bgCastle;
        bgForest = new Image();
        bgCastle = new Image();
        bgForest.src = "https://i.pinimg.com/originals/4d/2c/18/4d2c18ff246d65258f1b76506637a6e5.jpg";
        bgCastle.src = "https://i.pinimg.com/736x/48/7e/0f/487e0fc813b4641d6ace96312ea68e1b.jpg";
        let currentBG = 'forest';
        let bgTimer = 0;
        const BG_CHANGE_FRAMES = 210;   // ~3.5 сек
        
        // Кастомные пиксельные спрайты персонажа (определим в отрисовке)
        
        // ----- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ -----
        function updateMoneyDisplay() { document.getElementById('moneyAmount').innerText = Math.floor(money); }
        function updateScoreDisplay() { document.getElementById('scoreValue').innerText = score; }
        function updateSpeedDisplay() { document.getElementById('speedLevel').innerText = speedLevel; }
        
        // Покупка скорости
        function buySpeed() {
            if(!gameRunning || victory) return;
            let cost = 50;
            if(money >= cost) {
                money -= cost;
                speedLevel++;
                // скорость увеличивается: база 3.2 + 0.7 за уровень, максимальная 8
                currentSpeed = Math.min(3.2 + (speedLevel-1) * 0.75, 8.5);
                updateMoneyDisplay();
                updateSpeedDisplay();
            } else {
                // звуков нет, но мигание
                let msg = document.createElement('div');
                msg.textContent = "❌ НЕ ХВАТАЕТ ГАЛЛЕОНОВ!";
                msg.style.position = 'fixed'; msg.style.bottom = '20px'; msg.style.left='30%'; msg.style.background='black'; msg.style.color='gold'; msg.style.padding='4px'; msg.style.fontFamily='monospace'; document.body.appendChild(msg);
                setTimeout(()=>msg.remove(), 800);
            }
        }
        
        // Рестарт игры (полный)
        function restartGame() {
            gameRunning = true;
            victory = false;
            score = 0;
            money = 80;
            speedLevel = 1;
            currentSpeed = 3.2;
            obstacles = [];
            spawnCounter = 5;
            updateMoneyDisplay();
            updateScoreDisplay();
            updateSpeedDisplay();
            
            // пересоздать снитч
            snitch = {
                x: 50 + Math.random() * (cw - 100),
                y: 40 + Math.random() * (ch - 150),
                radius: SNITCH_RADIUS,
                captured: false
            };
            snitchActive = true;
            snitchSpeedX = (Math.random() > 0.5 ? 1.4 : -1.4) * 0.9;
            snitchSpeedY = (Math.random() > 0.5 ? 1.2 : -1.2) * 0.9;
            
            playerX = cw/2 - PLAYER_W/2;
            mouseX = playerX + PLAYER_W/2;
            currentBG = 'forest';
            bgTimer = 0;
        }
        
        // Спавн коричневого шара
        function spawnBrownBall() {
            let randX = 18 + Math.random() * (cw - 36);
            obstacles.push({
                x: randX,
                y: -BROWN_RADIUS,
                radius: BROWN_RADIUS,
                type: 'brown'
            });
        }
        
        // Обновление логики (движение, коллизии, снитч)
        function updateGame() {
            if(!gameRunning) return;
            if(victory) return; // если победа, заморозить движение
            
            // Движение игрока
            let targetX = mouseX - PLAYER_W/2;
            targetX = Math.min(Math.max(targetX, 6), cw - PLAYER_W - 6);
            playerX = targetX;
            
            // ---- КОРИЧНЕВЫЕ ШАРЫ ----
            for(let i=0; i<obstacles.length; i++) {
                obstacles[i].y += currentSpeed;
            }
            // Удаление ушедших за низ и начисление очков (за каждый ушедший шар)
            let newObs = [];
            for(let obs of obstacles) {
                if(obs.y + obs.radius < ch) {
                    newObs.push(obs);
                } else {
                    if(gameRunning && !victory) {
                        score++;
                        updateScoreDisplay();
                        // даем монетки за уворот (каждый шар +2 галлеона)
                        money += 2;
                        updateMoneyDisplay();
                    }
                }
            }
            obstacles = newObs;
            
            // Спавн шаров
            spawnCounter++;
            let dynamicSpawn = Math.max(20, 32 - Math.floor(speedLevel * 1.2));
            if(spawnCounter >= dynamicSpawn && gameRunning && !victory) {
                spawnCounter = 0;
                spawnBrownBall();
                if(Math.random() < 0.35) spawnBrownBall();
            }
            
            // ---- СНИТЧ (ЗОЛОТОЙ СИЯЮЩИЙ ШАР) ----
            if(snitch && !snitch.captured && !victory) {
                // летает хаотично
                snitch.x += snitchSpeedX;
                snitch.y += snitchSpeedY;
                // отскок от границ
                if(snitch.x - SNITCH_RADIUS < 5) { snitch.x = 5 + SNITCH_RADIUS; snitchSpeedX = -snitchSpeedX; }
                if(snitch.x + SNITCH_RADIUS > cw - 5) { snitch.x = cw - 5 - SNITCH_RADIUS; snitchSpeedX = -snitchSpeedX; }
                if(snitch.y - SNITCH_RADIUS < 25) { snitch.y = 25 + SNITCH_RADIUS; snitchSpeedY = -snitchSpeedY; }
                if(snitch.y + SNITCH_RADIUS > ch - 20) { snitch.y = ch - 20 - SNITCH_RADIUS; snitchSpeedY = -snitchSpeedY; }
                
                // Проверка столкновения с игроком (пиксельный прямоугольник)
                const playerRect = { x: playerX, y: playerY, w: PLAYER_W, h: PLAYER_H };
                const snitchCenter = { x: snitch.x, y: snitch.y };
                const closestX = Math.max(playerRect.x, Math.min(snitchCenter.x, playerRect.x+playerRect.w));
                const closestY = Math.max(playerRect.y, Math.min(snitchCenter.y, playerRect.y+playerRect.h));
                const dx = closestX - snitchCenter.x;
                const dy = closestY - snitchCenter.y;
                const dist = Math.sqrt(dx*dx+dy*dy);
                if(dist < SNITCH_RADIUS + 5) {
                    // ПОЙМАЛ СНИТЧ -> ПОБЕДА
                    victory = true;
                    gameRunning = false;  // игра останавливается, но отображаем победу
                    snitch.captured = true;
                    // бонусные монеты
                    money += 150;
                    updateMoneyDisplay();
                    return;
                }
            } else if(!snitch && !victory) {
                // страховка: если снитч пропал (случайно), создаём заново
                snitch = {
                    x: 100 + Math.random() * (cw-200),
                    y: 60 + Math.random() * (ch-140),
                    radius: SNITCH_RADIUS,
                    captured: false
                };
                snitchSpeedX = (Math.random()>0.5?1.2:-1.2);
                snitchSpeedY = (Math.random()>0.5?1.0:-1.0);
            }
            
            // Проверка столкновений с коричневыми шарами (если задели - проигрыш)
            for(let obs of obstacles) {
                const closestX2 = Math.max(playerX, Math.min(obs.x, playerX+PLAYER_W));
                const closestY2 = Math.max(playerY, Math.min(obs.y, playerY+PLAYER_H));
                const dx2 = closestX2 - obs.x;
                const dy2 = closestY2 - obs.y;
                if(Math.sqrt(dx2*dx2+dy2*dy2) < obs.radius + 5) {
                    gameRunning = false;
                    victory = false; // проигрыш, не победа
                    break;
                }
            }
            
            // Смена фона
            bgTimer++;
            if(bgTimer >= BG_CHANGE_FRAMES && gameRunning && !victory) {
                bgTimer = 0;
                currentBG = (currentBG === 'forest') ? 'castle' : 'forest';
            }
        }
        
        // ---------- ПИКСЕЛЬНЫЙ РЕНДЕР ----------
        function drawPixelatedBackground() {
            let img = (currentBG === 'forest') ? bgForest : bgCastle;
            if(img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, 0, 0, cw, ch);
            } else {
                ctx.fillStyle = currentBG === 'forest' ? '#2c5e3a' : '#3a3c5e';
                ctx.fillRect(0, 0, cw, ch);
                ctx.fillStyle = '#d4c99e';
                ctx.font = "bold 16px 'Courier New'";
                ctx.fillText(currentBG === 'forest' ? "ЗАПРЕТНЫЙ ЛЕС" : "ХОГВАРТС", 20, 45);
            }
            // пиксельная сетка (лёгкая текстура)
            ctx.globalAlpha = 0.15;
            for(let i=0; i<cw; i+=12) {
                ctx.beginPath();
                ctx.moveTo(i,0);
                ctx.lineTo(i,ch);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
            for(let i=0; i<ch; i+=12) {
                ctx.beginPath();
                ctx.moveTo(0,i);
                ctx.lineTo(cw,i);
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }
        
        // Коричневый шар пиксельный
        function drawBrownBall(x,y,r) {
            ctx.fillStyle = '#8B5A2B';
            ctx.beginPath();
            ctx.arc(x, y, r-1, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#5a3a1a';
            ctx.beginPath();
            ctx.arc(x-2, y-2, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#c47e3a';
            ctx.beginPath();
            ctx.rect(x-5, y-2, 4, 4);
            ctx.fill();
            // текстура
            ctx.fillStyle = '#4d2f10';
            ctx.fillRect(x+3, y+1, 3, 3);
        }
        
        // Золотой сияющий снитч (крылья)
        function drawGoldenSnitch(x,y,r) {
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffcc44';
            ctx.fillStyle = '#F7D44A';
            ctx.beginPath();
            ctx.arc(x, y, r-1, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#E5B824';
            ctx.beginPath();
            ctx.arc(x-2, y-2, 3, 0, Math.PI*2);
            ctx.fill();
            // крылья
            ctx.fillStyle = '#FFE484';
            ctx.beginPath();
            ctx.moveTo(x+9, y-3);
            ctx.lineTo(x+17, y-8);
            ctx.lineTo(x+13, y);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x-9, y-3);
            ctx.lineTo(x-17, y-8);
            ctx.lineTo(x-13, y);
            ctx.fill();
            ctx.fillStyle = '#FFBF00';
            ctx.beginPath();
            ctx.ellipse(x, y, 4, 6, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // сияние
            for(let i=0;i<4;i++) {
                ctx.beginPath();
                ctx.arc(x + Math.sin(Date.now()*0.012 + i)*5, y + Math.cos(Date.now()*0.009 + i)*4, 2, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,215,0,0.7)`;
                ctx.fill();
            }
        }
        
        // Пиксельный ученик
        function drawPixelStudent(x, y, w, h, style) {
            // метла
            ctx.fillStyle = '#b97f44';
            ctx.fillRect(x+12, y+28, w-24, 6);
            ctx.fillStyle = '#9b5e2c';
            ctx.fillRect(x+8, y+30, 6, 4);
            ctx.fillRect(x+w-14, y+30, 6, 4);
            // тело
            ctx.fillStyle = '#2f2a3a';
            ctx.fillRect(x+8, y+14, w-16, h-18);
            // голова
            ctx.fillStyle = '#eac296';
            ctx.fillRect(x+12, y+6, w-24, 16);
            // волосы/детали
            if(style === 'harry') {
                ctx.fillStyle = '#2c1e10';
                ctx.fillRect(x+10, y+4, 6, 8);
                ctx.fillRect(x+w-16, y+4, 6, 8);
                ctx.fillStyle = '#000';
                ctx.fillRect(x+14, y+10, 3, 3);
                ctx.fillRect(x+w-17, y+10, 3, 3);
                ctx.fillStyle = '#aa2e1e';
                ctx.fillRect(x+18, y+18, 6, 4);
            } else if(style === 'hermione') {
                ctx.fillStyle = '#9b6a3c';
                ctx.fillRect(x+10, y+2, w-20, 10);
                ctx.fillStyle = '#5a3e2a';
                ctx.fillRect(x+14, y+14, 3, 5);
                ctx.fillRect(x+w-17, y+14, 3, 5);
                ctx.fillStyle = '#614126';
                ctx.fillRect(x+24, y+22, 8, 5);
            } else if(style === 'draco') {
                ctx.fillStyle = '#bfb282';
                ctx.fillRect(x+10, y+2, w-20, 8);
                ctx.fillStyle = '#4f6b6b';
                ctx.fillRect(x+24, y+20, 6, 6);
                ctx.fillStyle = '#c9b36b';
                ctx.fillRect(x+28, y+26, 4, 4);
            } else if(style === 'luna') {
                ctx.fillStyle = '#b5986a';
                ctx.fillRect(x+12, y+2, 6, 12);
                ctx.fillRect(x+w-18, y+2, 6, 12);
                ctx.fillStyle = '#d89f78';
                ctx.beginPath();
                ctx.fillRect(x+20, y+24, 6, 6);
                ctx.fillStyle = '#c0d43b';
                ctx.fillRect(x+14, y+30, 4, 5);
            }
            // шарф
            ctx.fillStyle = '#ac2f2f';
            ctx.fillRect(x+8, y+22, w-16, 5);
            ctx.fillStyle = '#e3b13c';
            ctx.fillRect(x+8, y+25, w-16, 3);
        }
        
        // отрисовка всего
        function draw() {
            drawPixelatedBackground();
            
            // коричневые шары
            for(let o of obstacles) {
                drawBrownBall(o.x, o.y, o.radius);
            }
            
            // снитч если активен
            if(snitch && !snitch.captured && !victory && gameRunning) {
                drawGoldenSnitch(snitch.x, snitch.y, SNITCH_RADIUS);
            } else if(snitch && !snitch.captured && victory === false && gameRunning === false) {
                // если игра проиграна, снитч не рисуем
            } else if(victory && snitch && snitch.captured){
                drawGoldenSnitch(snitch.x, snitch.y, SNITCH_RADIUS);
            }
            
            // персонаж
            const selected = characterSelect.value;
            drawPixelStudent(playerX, playerY, PLAYER_W, PLAYER_H, selected);
            
            // эффект ветра
            ctx.fillStyle = '#b9ccaa33';
            for(let i=0;i<3;i++) {
                ctx.fillRect(playerX-6+i*9, playerY+22, 5, 2);
            }
            
            // СОСТОЯНИЯ ПОБЕДА/ПРОИГРЫШ
            if(!gameRunning && !victory) {
                ctx.fillStyle = '#000000aa';
                ctx.fillRect(0,0,cw,ch);
                ctx.fillStyle = '#ffaa66';
                ctx.font = 'bold 28px "Courier New"';
                ctx.fillText('💀 ВАС СБИЛ КОРИЧНЕВЫЙ ШАР', cw/2-210, ch/2-40);
                ctx.font = '18px monospace';
                ctx.fillStyle = '#fad455';
                ctx.fillText(`Набрано очков: ${score}   |   Галлеонов: ${Math.floor(money)}`, cw/2-180, ch/2+20);
                ctx.fillStyle = '#eee2bb';
                ctx.fillText('Нажмите "НОВАЯ ИГРА"', cw/2-90, ch/2+70);
            }
            else if(victory && !gameRunning) {
                ctx.fillStyle = '#152015cc';
                ctx.fillRect(0,0,cw,ch);
                ctx.fillStyle = '#FFD966';
                ctx.font = 'bold 34px "Courier New"';
                ctx.fillText('✨ ПОБЕДА! ВЫ ПОЙМАЛИ СНИТЧА ✨', cw/2-245, ch/2-35);
                ctx.font = '20px monospace';
                ctx.fillStyle = '#FFE49E';
                ctx.fillText(`Итоговый счёт: ${score}   |   +150 галлеонов!`, cw/2-180, ch/2+25);
                ctx.fillStyle = '#bd9e3a';
                ctx.fillText('Теперь можешь купить ещё скорости и переиграть', cw/2-190, ch/2+80);
            }
            
            // подпись скорости
            ctx.font = "bold 12px monospace";
            ctx.fillStyle = "#FFE0A3";
            ctx.fillText("speed Lv."+speedLevel, cw-65, 28);
        }
        
        // ---------- УПРАВЛЕНИЕ ----------
        function handleMove(clientX) {
            if(!gameRunning || victory) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let canvasX = (clientX - rect.left) * scaleX;
            canvasX = Math.min(Math.max(canvasX, PLAYER_W/2 + 5), cw - PLAYER_W/2 - 5);
            mouseX = canvasX;
        }
        
        function onMouseMove(e) { handleMove(e.clientX); }
        function onTouchMove(e) { e.preventDefault(); if(e.touches.length) handleMove(e.touches[0].clientX); }
        function onTouchStart(e) { e.preventDefault(); if(e.touches.length) handleMove(e.touches[0].clientX); }
        
        // ----- АНИМАЦИЯ -----
        let animFrame;
        function gameLoop() {
            if(gameRunning && !victory) {
                updateGame();
            }
            draw();
            animFrame = requestAnimationFrame(gameLoop);
        }
        
        // события и кнопки
        document.getElementById('buySpeedBtn').addEventListener('click', () => { if(!victory && gameRunning) buySpeed(); else if(victory && !gameRunning) { /* ничего */ } });
        restartBtn.addEventListener('click', () => { restartGame(); gameRunning = true; victory = false; });
        function bindControls() {
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('touchmove', onTouchMove, {passive:false});
            canvas.addEventListener('touchstart', onTouchStart, {passive:false});
        }
        
        // инициализация
        function init() {
            restartGame();
            bindControls();
            gameLoop();
        }
        
        window.addEventListener('load', () => {
            init();
        });
    })();
</script>
</body>
</html>
